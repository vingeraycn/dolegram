name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run verify:local
      - run: npm run build:sites
      - run: python3 -m unittest discover -s test -p '*_test.py'
  macos-launcher:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: swiftc scripts/keychain-launcher.swift -o "$RUNNER_TEMP/dotg-keychain-launcher"
      - run: '"$RUNNER_TEMP/dotg-keychain-launcher" --self-test'
